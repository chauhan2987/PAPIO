# ==============================================================================
#  PAPIO - germline WES (single sample)
#  Demo data: SEQC2 HCC1395BL (normal) - samplesheets/dna_germline.csv
#
#  Run from any folder (README: genomics_pipeline/). Paths follow the README layout:
#  ${projectDir} (expanded by Nextflow) is this nextflow/ folder; references/,
#  containers/, demo/ and runs/ sit next to it. Edit a path only if yours differ.
#  1. bash nextflow/scripts/download_demo_fastq.sh demo        (from genomics_pipeline/)
#  2. set the capture kit and optional resources below
#  3. bash scripts/check_installation.sh params/params_germline.yaml
#  4. nextflow run main.nf -params-file params/params_germline.yaml           # LSF (default)
#     add  -profile slurm  or  -profile local  on other systems
# ==============================================================================

# ---- run paths ---------------------------------------------------------------
pipeline_root   : ${projectDir}/..
work_root       : ${projectDir}/../runs/germline_demo
outdir          : ${projectDir}/../runs/germline_demo/Result
container_dir   : ${projectDir}/../containers
bind_paths      : ['${projectDir}/../references', '${projectDir}/../runs', '${projectDir}/../demo']

# ---- input -------------------------------------------------------------------
fastq_root      : ${projectDir}/../demo/fastq
dna_samplesheet : ${projectDir}/../demo/samplesheets/dna_germline.csv

# ---- mode --------------------------------------------------------------------
assay              : wes
analysis           : germline
start_at           : mapping
stop_at            : classification
dedup_mode         : markdup     # demo libraries have no UMIs
umi_read_structure : null
bqsr               : false

germline_caller : haplotypecaller   # haplotypecaller | deepvariant
germline_filter : nv                # nv = single-sample CNN scoring; vqsr needs >= 30 samples
run_gcnv        : false             # gCNV needs a cohort of >= 30 normals; off for a single sample
run_roh         : true              # gated off automatically for WES (roh_allow_wes: false)

# ---- reference genome (GRCh38.d1.vd1) ----------------------------------------
ref_index_dir   : ${projectDir}/../references/genome/bwa_mem2
ref_fasta       : ${projectDir}/../references/genome/GRCh38.d1.vd1.fa
ref_fai         : ${projectDir}/../references/genome/GRCh38.d1.vd1.fa.fai
ref_dict        : ${projectDir}/../references/genome/GRCh38.d1.vd1.dict
dbsnp           : ${projectDir}/../references/gatk/Homo_sapiens_assembly38.dbsnp138.vcf.gz
mills           : ${projectDir}/../references/gatk/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz
known_indels    : ${projectDir}/../references/gatk/Homo_sapiens_assembly38.known_indels.vcf.gz
hapmap          : ${projectDir}/../references/gatk/hapmap_3.3.hg38.vcf.gz
omni            : ${projectDir}/../references/gatk/1000G_omni2.5.hg38.vcf.gz
thousandg_snps  : ${projectDir}/../references/gatk/1000G_phase1.snps.high_confidence.hg38.vcf.gz

# ---- capture kit: Agilent SureSelect V6+UTR (S07604624) - demo ---------------
interval_bed         : ${projectDir}/../references/capture/S07604624/S07604624_targets.bed
bait_interval_list   : ${projectDir}/../references/capture/S07604624/S07604624_baits.interval_list
target_interval_list : ${projectDir}/../references/capture/S07604624/S07604624_targets.interval_list
call_regions_gz      : ${projectDir}/../references/capture/S07604624/S07604624_targets_pad100.bed.gz
scatter_intervals    : ${projectDir}/../references/capture/S07604624/S07604624_scatter_24_pad100
germline_scatter_intervals : ${projectDir}/../references/capture/S07604624/S07604624_scatter_150_pad100

# ---- capture kit: Agilent SureSelect V7 (S31285117) - own cohort -------------
# interval_bed         : ${projectDir}/../references/capture/S31285117/S31285117_targets.bed
# bait_interval_list   : ${projectDir}/../references/capture/S31285117/S31285117_baits.interval_list
# target_interval_list : ${projectDir}/../references/capture/S31285117/S31285117_targets.interval_list
# call_regions_gz      : ${projectDir}/../references/capture/S31285117/S31285117_targets_pad100.bed.gz
# scatter_intervals    : ${projectDir}/../references/capture/S31285117/S31285117_scatter_24_pad100
# germline_scatter_intervals : ${projectDir}/../references/capture/S31285117/S31285117_scatter_150_pad100

# ---- QC ----------------------------------------------------------------------
verifybamid_db : null   # optional VerifyBamID2 resource prefix (normals), e.g. ${projectDir}/../references/verifybamid2/1000g.phase3.100k.b38
somalier_sites : ${projectDir}/../references/somalier/sites.hg38.vcf.gz
somalier_ancestry_labels : ${projectDir}/../references/somalier/ancestry-labels-1kg.tsv   # ancestry of normals (optional)
somalier_1kg_dir         : ${projectDir}/../references/somalier/1kg-somalier
coverage_report_bed      : ${projectDir}/../references/annotation/ensembl115_reportable_genes_MANE_CDS.bed   # per-gene coverage of reportable genes

# ---- annotation + report -----------------------------------------------------
vep_cache_dir     : ${projectDir}/../references/vep_cache
vep_cache_version : 115
vep_plugins_dir   : ${projectDir}/../references/vep_plugins
clinvar_vcf       : ${projectDir}/../references/clinvar/clinvar_YYYYMMDD.vcf.gz
gnomad_faf_vcf    : ${projectDir}/../references/gnomad/variantsGnomADv4.1Joint.vcf.bgz   # gnomAD v4.1 filtering AF (README Appendix A, step 7.6)
germline_report_genes : ${projectDir}/../references/annotation/reportable_genes.txt   # germline LoF report gene list (edit for your study)
annotsv_dir       : ${projectDir}/../references/annotsv

# ---- scheduler ---------------------------------------------------------------
lsf_project : null
