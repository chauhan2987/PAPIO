# ==============================================================================
#  PAPIO - RNA fusion detection (bulk RNA-seq)
#  Demo data: HCC1395 RNA-seq SRR9134735 - samplesheets/rna_fusion.csv
#
#  Run from any folder (README: genomics_pipeline/). Paths follow the README layout:
#  ${projectDir} (expanded by Nextflow) is this nextflow/ folder; references/,
#  containers/, demo/ and runs/ sit next to it. Edit a path only if yours differ.
#  1. bash nextflow/scripts/download_demo_fastq.sh demo        (from genomics_pipeline/)
#  2. set the capture kit and optional resources below
#  3. bash scripts/check_installation.sh params/params_rna_fusion.yaml
#  4. nextflow run main.nf -params-file params/params_rna_fusion.yaml         # LSF (default)
#     add  -profile slurm  or  -profile local  on other systems
#
#  STAR, Arriba and RNA QC use the DNA genome (GRCh38.d1.vd1) with GENCODE v49
#  (= Ensembl 115, the DNA arm's annotation); STAR-Fusion and FusionInspector use
#  the CTAT library (GENCODE v44). The GTF, FASTA and STAR index must match each
#  other (same contig names), otherwise STAR-Fusion reports nothing.
# ==============================================================================

# ---- run paths ---------------------------------------------------------------
pipeline_root   : ${projectDir}/..
work_root       : ${projectDir}/../runs/rna_demo
outdir          : ${projectDir}/../runs/rna_demo/Result
container_dir   : ${projectDir}/../containers
bind_paths      : ['${projectDir}/../references', '${projectDir}/../runs', '${projectDir}/../demo']

# ---- input -------------------------------------------------------------------
fastq_root      : ${projectDir}/../demo/fastq
rna_samplesheet : ${projectDir}/../demo/samplesheets/rna_fusion.csv

# ---- mode --------------------------------------------------------------------
assay    : rna
analysis : rna_fusion
start_at : mapping
stop_at  : classification

# ---- genome, GENCODE v49 and STAR index (built by setup.sh --full) -------------
rna_use_ctat_reference : false
ref_fasta : ${projectDir}/../references/genome/GRCh38.d1.vd1.fa
ref_fai   : ${projectDir}/../references/genome/GRCh38.d1.vd1.fa.fai
gtf       : ${projectDir}/../references/gencode/gencode.v49.annotation.gtf
star_index: ${projectDir}/../references/star/StarIndex_gencode_v49

# ---- CTAT library (GENCODE v44): STAR-Fusion and FusionInspector --------------
ctat_lib  : ${projectDir}/../references/ctat/GRCh38_gencode_v44_CTAT_lib_Oct292023.plug-n-play/ctat_genome_lib_build_dir

# ---- RNA QC (optional) -------------------------------------------------------
refflat            : ${projectDir}/../references/rna_qc/gencode.v49.refFlat
rrna_interval_list : ${projectDir}/../references/rna_qc/gencode.v49.rrna.interval_list

# ---- expression and immune features (optional; each step runs when its resource is set) ----
salmon_transcripts : ${projectDir}/../references/star/gencode.v49.annotation.transcripts.fa   # Salmon on STAR's transcriptome alignments; same gtf + genome as star_index
trust4_ref_dir : ${projectDir}/../references/trust4                             # TRUST4 TCR/BCR repertoire
telescope_gtf  : ${projectDir}/../references/telescope/HERV_rmsk.hg38.v2.gtf    # Telescope HERV expression

# ---- fusion callers ----------------------------------------------------------
use_arriba          : true
use_starfusion      : true
use_fusioncatcher   : true
use_fusioninspector : true

arriba_blacklist       : ${projectDir}/../references/arriba/blacklist_hg38_GRCh38_v2.5.1.tsv.gz
arriba_known_fusions   : ${projectDir}/../references/arriba/known_fusions_hg38_GRCh38_v2.5.1.tsv.gz
arriba_protein_domains : ${projectDir}/../references/arriba/protein_domains_hg38_GRCh38_v2.5.1.gff3
fusioncatcher_db       : ${projectDir}/../references/fusioncatcher/human_v102
known_fusions_tsv      : ${projectDir}/../references/fusion/known_fusions_hg38_GRCh38_v2.5.1.tsv
cosmic_cgc_tsv         : ${projectDir}/../references/cosmic/Cosmic_CancerGeneCensus_v104_GRCh38.tsv.gz   # COSMIC licence

# ---- consensus ---------------------------------------------------------------
# fusion_min_callers: 2 = PASS_CONSENSUS needs >= 2 callers. Fusions below the
# threshold are NOT discarded: they are kept and labelled (REVIEW, or PASS_KNOWN
# when in the known-fusion catalog). Set 1 to treat every caller's call as PASS.
fusion_min_callers    : 2
fusion_readthrough_kb : 200
rna_shared_star       : false

# ---- scheduler ---------------------------------------------------------------
lsf_project : null
