# ==============================================================================
#  PAPIO - somatic tumour-normal WES, SENSITIVITY-oriented preset
#  Identical to params_somatic.yaml except: consensus needs only 1 caller (the
#  Mutect2 PASS backbone still applies) and failing calls are labelled, not
#  removed. Every call keeps INFO/CALLERS + INFO/NCALLERS and its filter labels,
#  so the precision set can be recovered afterwards by filtering on them.
#  Use when missing a true variant costs more than reviewing extra candidates
#  (low-purity or subclonal discovery).
#
#  nextflow run main.nf -params-file params/params_somatic_sensitive.yaml
# ==============================================================================

# ---- run paths ---------------------------------------------------------------
pipeline_root   : /path/to/PAPIO
work_root       : /path/to/run/somatic_demo_sensitive
outdir          : /path/to/run/somatic_demo_sensitive/Result
container_dir   : /path/to/papio_containers
bind_paths      : ['/path/to/papio_resources', '/path/to/run', '/path/to/demo']

# ---- input -------------------------------------------------------------------
fastq_root      : /path/to/demo/fastq
dna_samplesheet : /path/to/demo/samplesheets/dna_somatic.csv

# ---- mode --------------------------------------------------------------------
assay           : wes
analysis        : somatic
start_at        : mapping
stop_at         : classification

# SEQC2 WES libraries carry no UMIs: coordinate duplicate marking, and NO read
# structure (the markdup path hard-trims the leading non-template bases of
# umi_read_structure; a UMI structure on a library without UMIs would clip its leading bases).
dedup_mode         : markdup
umi_read_structure : null
bqsr               : false

# ---- reference genome (GRCh38.d1.vd1) ----------------------------------------
ref_index_dir   : /path/to/papio_resources/genome/bwa_mem2
ref_fasta       : /path/to/papio_resources/genome/GRCh38.d1.vd1.fa
ref_fai         : /path/to/papio_resources/genome/GRCh38.d1.vd1.fa.fai
ref_dict        : /path/to/papio_resources/genome/GRCh38.d1.vd1.dict
dbsnp           : /path/to/papio_resources/gatk/Homo_sapiens_assembly38.dbsnp138.vcf.gz
mills           : /path/to/papio_resources/gatk/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz
known_indels    : /path/to/papio_resources/gatk/Homo_sapiens_assembly38.known_indels.vcf.gz

# ---- capture kit: Agilent SureSelect V6+UTR (S07604624) - demo ---------------
interval_bed         : /path/to/papio_resources/capture/S07604624/S07604624_targets.bed
bait_interval_list   : /path/to/papio_resources/capture/S07604624/S07604624_baits.interval_list
target_interval_list : /path/to/papio_resources/capture/S07604624/S07604624_targets.interval_list
call_regions_gz      : /path/to/papio_resources/capture/S07604624/S07604624_targets_pad100.bed.gz
scatter_intervals    : /path/to/papio_resources/capture/S07604624/scatter_24_pad100

# ---- capture kit: Agilent SureSelect V7 (S31285117) - own cohort -------------
# interval_bed         : /path/to/papio_resources/capture/S31285117/S31285117_targets.bed
# bait_interval_list   : /path/to/papio_resources/capture/S31285117/S31285117_baits.interval_list
# target_interval_list : /path/to/papio_resources/capture/S31285117/S31285117_targets.interval_list
# call_regions_gz      : /path/to/papio_resources/capture/S31285117/S31285117_targets_pad100.bed.gz
# scatter_intervals    : /path/to/papio_resources/capture/S31285117/scatter_24_pad100

# ---- somatic calling ---------------------------------------------------------
germline_resource : /path/to/papio_resources/gatk/af-only-gnomad.hg38.vcf.gz
panel_of_normals  : /path/to/papio_resources/gatk/1000g_pon.hg38.vcf.gz
pileup_variants   : /path/to/papio_resources/gatk/small_exac_common_3.hg38.vcf.gz
orientation_bias  : true

somatic_consensus           : true
use_muse_in_consensus       : true
use_strelka2_in_consensus   : true
use_varscan_in_consensus    : true
consensus_min_snv_callers   : 1
consensus_min_indel_callers : 1
consensus_filter_mode       : tag     # tag = keep all, label sub-threshold LOWCONSENSUS
somatic_filter_mode         : tag     # tag = keep all, label failing filters

# ---- CNV / purity / MSI / QC (each optional; step skipped if unset) -----------
cnvkit_pon         : /path/to/papio_resources/capture/S07604624/cnvkit_pon.cnn   # must be built for the SAME capture kit
msisensor_list     : /path/to/papio_resources/msi/GRCh38.d1.vd1.msisensor.list
sequenza_gc_wiggle : /path/to/papio_resources/sequenza/GRCh38.d1.vd1.gc50Base.wig.gz
gene_bed           : /path/to/papio_resources/annotation/ensembl115_genes.bed
tmb_coding_bed     : /path/to/papio_resources/annotation/ensembl115_MANE_CDS.bed   # WES TMB territory = capture x CDS (README Appendix A, step 6)
arm_bed            : /path/to/papio_resources/annotation/GRCh38_arms.bed   # chromosome arms (README Appendix A, step 6.3)
verifybamid_db     : /path/to/papio_resources/verifybamid2/1000g.phase3.100k.b38
somalier_sites     : /path/to/papio_resources/somalier/sites.hg38.vcf.gz
somalier_ancestry_labels : /path/to/papio_resources/somalier/ancestry-labels-1kg.tsv   # ancestry of normals (optional)
somalier_1kg_dir         : /path/to/papio_resources/somalier/1kg-somalier
coverage_report_bed      : /path/to/papio_resources/annotation/reportable_genes_MANE_CDS.bed   # per-gene coverage of reportable genes

# ---- annotation + classification ---------------------------------------------
vep_cache_dir     : /path/to/papio_resources/vep_cache
vep_cache_version : 115
vep_plugins_dir   : /path/to/papio_resources/vep_plugins
clinvar_vcf       : /path/to/papio_resources/clinvar/clinvar_YYYYMMDD.vcf.gz
gnomad_faf_vcf    : /path/to/papio_resources/gnomad/variantsGnomADv4.1Joint.vcf.bgz   # gnomAD v4.1 filtering AF (README Appendix A, step 7.6)
germline_report_genes : /path/to/papio_resources/annotation/reportable_genes.txt   # germline LoF report gene list (edit for your study)
cosmic_vcf        : /path/to/papio_resources/cosmic/cosmic_genome_screens_v104_chr_dedup.vcf.gz   # COSMIC licence
cosmic_cgc_tsv    : /path/to/papio_resources/cosmic/Cosmic_CancerGeneCensus_v104_GRCh38.tsv.gz  # COSMIC licence
annotsv_dir       : /path/to/papio_resources/annotsv

# ---- scheduler ---------------------------------------------------------------
lsf_project : null
